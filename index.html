<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title> Daily wisdom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>vkBridge.send('VKWebAppInit');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">🧠 <span class="title-text">حكمة اليوم</span> <span class="title-sub">Daily Wisdom</span></h1>
      
      <div class="controls" role="form" aria-label="Quote preferences">
        <div class="control-group">
          <label for="languageSelect" id="languageLabel">اللغة | Language | Язык</label>
          <select id="languageSelect" onchange="changeLanguage()" aria-label="Select language">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ru">Русский</option>
          </select>
        </div>
        
        <div class="control-group">
          <label for="categorySelect" id="categoryLabel">الفئة | Category | Категория</label>
          <select id="categorySelect" onchange="filterQuotes()" aria-label="Select quote category">
            <option value="all">الكل | All</option>
            <option value="wisdom">حكمة | Wisdom</option>
            <option value="inspiration">إلهام | Inspiration</option>
            <option value="success">نجاح | Success</option>
            <option value="life">حياة | Life</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <div id="quoteCard" class="quote-card animate__animated">
        <div id="quote" class="quote-text"></div>
        <div id="quoteAuthor" class="quote-author"></div>
      </div>
      
      <div class="actions">
        <button id="quoteButton" class="btn primary" onclick="showQuote()">
          <span class="btn-icon">💭</span>
          <span id="quoteButtonText">اقتباس جديد</span>
        </button>
        <button id="copyButton" class="btn secondary" onclick="copyToClipboard()">
          <span class="btn-icon">📋</span>
          <span id="copyButtonText">نسخ</span>
        </button>
        <button id="shareButton" class="btn secondary" onclick="shareQuote()">
          <span class="btn-icon">🔗</span>
          <span id="shareButtonText">مشاركة</span>
        </button>
        <button id="darkModeButton" class="btn icon" onclick="toggleDarkMode()" 
                aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="btn-icon" id="darkModeIcon">🌓</span>
        </button>
      </div>
    </main>
    
    <footer>
      <p>Made with ❤️ | <span id="quoteCount">0</span> quotes available</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
